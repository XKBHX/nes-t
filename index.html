        <title>NES Emulator</title>
    </head>
    <body>
        <h1>NES World!</h1>
        <label for="file">Choose ROM</label>
        <input type="file" id="imagefile" accept=".png,.webp">
        <input type="file" id="file" accept=".nes">
        <button id="step">step</button>
        <canvas id="canvas" width="780" height="480">
            Canvas not available
        </canvas>
        <button id="L">L</button> <button id="U">U</button> <button id="R">R</button> <button id="D">D</button>
        <button id="select">Select</button> <button id="start">Start</button> <button id="_b">B</button> <button id="_a">A</button>
        <table>
            <tr>
                <td><b>Status:</b></td>
                <td>
                    <pre style="display: inline; font-size: 30px;" class="flag" id="n"> N </pre>
                    <pre style="display: inline; font-size: 30px;" class="flag" id="v"> V </pre>
                    <pre style="display: inline; font-size: 30px;" class="flag" id="u"> U </pre>
                    <pre style="display: inline; font-size: 30px;" class="flag" id="b"> B </pre>
                    <pre style="display: inline; font-size: 30px;" class="flag" id="d"> D </pre>
                    <pre style="display: inline; font-size: 30px;" class="flag" id="i"> I </pre>
                    <pre style="display: inline; font-size: 30px;" class="flag" id="z"> Z </pre>
                    <pre style="display: inline; font-size: 30px;" class="flag" id="c"> C </pre>
                </td>
            </tr>
            <tr><td><b>PC:</b></td><td><pre style="display: inline; font-size: 30px;" class="flag" id="pc"></pre></td></tr>
            <tr><td><b>A:</b></td><td><pre style="display: inline; font-size: 30px;" class="flag" id="a"></pre></td></tr>
            <tr><td><b>X:</b></td><td><pre style="display: inline; font-size: 30px;" class="flag" id="x"></pre></td></tr>
            <tr><td><b>Y:</b></td><td><pre style="display: inline; font-size: 30px;" class="flag" id="y"></pre></td></tr>
            <tr><td><b>SP:</b></td><td><pre style="display: inline; font-size: 30px;" class="flag" id="sp"></pre></td></tr>
            <tr><td><b>FPS:</b></td><td><pre style="display: inline; font-size: 30px;" class="flag" id="fps"> 0</pre></td></tr>
            <tr><td><b>Cycles:</b></td><td><pre style="display: inline; font-size: 30px;" class="flag" id="cycles"> 0</pre></td></tr>
        </table>
        <table>
            <tr></tr>
        </table>
        <a href="sample.html">Sample</a>
