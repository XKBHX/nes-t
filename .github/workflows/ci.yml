name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          # Node 22's bundled npm 10.9.x can hang, then crash with
          # "Exit handler never called!" on a cold cache / large lockfile.
          npm install --global npm@11
          npm ci --no-audit --no-fund --maxsockets 1000

      - name: Run unit tests
        run: npm test

      - name: Run controller checks
        run: npm run validate:controller

      - name: Run MMC3 checks
        run: npm run validate:mmc3

      - name: Run APU checks
        run: npm run validate:apu
